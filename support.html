<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — The Mechanic</title>
<style>:root { color-scheme: dark; --bg: #111318; --panel: #1a1d24; --text: #edf0f5; --muted: #aeb6c5; --accent: #8ec5ff; --border: #343b49; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { width: min(900px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 4rem; }
article { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: clamp(1.25rem, 4vw, 3rem); box-shadow: 0 8px 30px #0004; }
h1, h2, h3 { color: #fff; line-height: 1.25; }
h1 { margin: 0 0 1.75rem; font-size: clamp(1.8rem, 4vw, 2.5rem); }
h2 { margin: 2.25rem 0 .65rem; font-size: 1.35rem; }
h3 { margin: 1.5rem 0 .5rem; font-size: 1.1rem; }
p, ul, ol { margin: .85rem 0; }
ul, ol { padding-left: 1.5rem; }
li + li { margin-top: .35rem; }
a { color: var(--accent); }
strong { color: #fff; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table { width: 100%; border-collapse: collapse; min-width: 34rem; }
th, td { border: 1px solid var(--border); padding: .65rem .75rem; text-align: left; vertical-align: top; }
th { background: #252b35; color: #fff; }
footer { color: var(--muted); font-size: .9rem; margin-top: 1rem; text-align: center; }
footer a { color: var(--muted); }</style>
</head>
<body>
<main>
<article>
<h1>Support — The Mechanic</h1>
<p><strong>The Mechanic is an offline app with no accounts.</strong> Your data stays on your device.</p>
<h2>Get support</h2>
<p>Owner: <strong>Ivan Rodriguez</strong>.</p>
<p>For questions, bug reports, or feedback, open a GitHub Issue:</p>
<p><a href="https://github.com/ivan-j-rodriguez/the-mechanic-demo/issues">The Mechanic support on GitHub Issues</a></p>
</article>
<footer><a href="./">The Mechanic</a> · Ivan Rodriguez</footer>
</main>
</body>
</html>
